services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Asia/Jerusalem
    volumes:
      - ./data:/app/data
    ports:
      # Private by default: reachable only from the server itself (put nginx/Caddy in front).
      # Set APP_BIND=0.0.0.0 in .env to expose http://<server-ip>:3000 directly.
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"

  # Automatic HTTPS (Let's Encrypt) for a server WITHOUT an existing web server on 80/443.
  # If nginx already runs on the server, use deploy/nginx-chafcrm.conf instead.
  # Start with:  docker compose --profile https up -d
  caddy:
    image: caddy:2
    restart: unless-stopped
    profiles: ["https"]
    depends_on: [app]
    environment:
      DOMAIN: ${DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
