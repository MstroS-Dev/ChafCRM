# ChafCRM behind an existing nginx.
# Install:
#   sudo sed "s/CRM_DOMAIN/crm.example.com/" deploy/nginx-chafcrm.conf | sudo tee /etc/nginx/sites-available/chafcrm
#   sudo ln -s /etc/nginx/sites-available/chafcrm /etc/nginx/sites-enabled/chafcrm
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d crm.example.com --redirect
server {
    listen 80;
    server_name CRM_DOMAIN;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
